# tmpfiles.d fragment — the socket directory (install as
# /etc/tmpfiles.d/system-explorer-skeleton.conf, applied by systemd-tmpfiles
# --create and at every boot before sockets.target). The socket unit binds
# /run/system-explorer/collect-system.sock at sockets.target, before
# se-collate.service has ever started, so the directory cannot come from
# that service's RuntimeDirectory=. 0755/system-explorer matches what
# RuntimeDirectory= applies when the collator does start, so ownership
# never flaps between the two mechanisms; the sockets inside are 0600, so
# the traversable directory exposes names, not access.
#
# MIRRORED in nix/skeleton-module.nix (systemd.tmpfiles.rules) — change
# both or neither.
d /run/system-explorer 0755 system-explorer system-explorer -
