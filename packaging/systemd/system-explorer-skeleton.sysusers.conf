# sysusers.d fragment — the collator's user (install as
# /etc/sysusers.d/system-explorer-skeleton.conf, applied by
# systemd-sysusers). A static system user rather than DynamicUser because
# the collector socket is mode 0600 owned by this user (DESIGN 18), and
# ownership needs a name that exists before any unit runs; sysusers is the
# portable spelling (the estate's earlier packaging also learned that a
# distro without libnss-systemd cannot resolve a dynamic user's name).
#
# MIRRORED in nix/skeleton-module.nix (users.users / users.groups) — change
# both or neither.
u system-explorer - "System Explorer collator" - -
