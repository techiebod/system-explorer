name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: conformance (2,898 tests incl. eight ported collectors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The corpus replays ported collectors as binaries, so the conformance
      # job needs the Go toolchain: without it the system variant would skip
      # on a workstation and FAIL here — the resolver treats CI as the place
      # a skip would be the subset guard (a green run that never reached the
      # variant), so this step is load-bearing, not an optimisation.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      # Compile check with a readable error, and it primes the build cache
      # the in-suite session build then hits; the binary pytest runs is
      # still the one the suite builds itself — one source, no drift.
      # ./cmd/... rather than a named list: a collector added to
      # GO_COLLECTORS and forgotten here would compile only inside pytest,
      # where the failure arrives as a fixture error rather than a build one.
      - run: go build ./cmd/...
        working-directory: go
      - run: python -m pip install -e ".[test,mcp]"
      - run: python -m pytest -q

  corpus:
    name: corpus coverage is stated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - name: corpus states its coverage, and is not empty
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, "harness")
          from se_harness import corpus

          variants = corpus.all_variants()
          report = corpus.coverage(variants)
          print(json.dumps(report, indent=2))
          # A job that only prints cannot fail, and a corpus that is empty
          # would print an empty report and go green — the exact shape the
          # replay harness exists to refuse.
          assert report["variants"], "corpus is empty"
          assert len(report["operating_systems"]) >= 2, (
              f"corpus covers {report['operating_systems']}: interface drift "
              "is what the corpus is for, and one OS cannot show it"
          )
          PY

  go:
    name: go toolchain (contract readable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - run: go vet ./...
        working-directory: go
      - run: go test ./...
        working-directory: go
