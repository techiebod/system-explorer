<svg viewBox="0 0 900 300" role="img" aria-label="Three collectors each publish fragments of native names for one disk; only the collator, which sees all three, can mint the single object identity that links them." xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="#7a8590" font-family="ui-monospace,Menlo,monospace" font-size="11.5">
    <text x="20" y="24" font-size="11" letter-spacing="1.6" fill="#7a8590" stroke="none" opacity=".65">EACH SAW A FRAGMENT</text>

    <rect x="20" y="44" width="290" height="58" rx="3"/>
    <text x="34" y="66" fill="#7a8590" stroke="none" font-weight="600">hardware</text>
    <text x="34" y="86" fill="#7a8590" stroke="none" opacity=".8">scsi 2:0:5:0 · wwn-0x5000c50… · /dev/sdc</text>

    <rect x="20" y="118" width="290" height="58" rx="3"/>
    <text x="34" y="140" fill="#7a8590" stroke="none" font-weight="600">storage</text>
    <text x="34" y="160" fill="#7a8590" stroke="none" opacity=".8">vdev member: by-id/wwn-0x5000c50…</text>

    <rect x="20" y="192" width="290" height="58" rx="3"/>
    <text x="34" y="214" fill="#7a8590" stroke="none" font-weight="600">enclosure</text>
    <text x="34" y="234" fill="#7a8590" stroke="none" opacity=".8">slot 3 · sas 0x5000c50… · wwn-0x5000c50…</text>

    <path d="M 310 73 C 380 73, 400 130, 470 145" marker-end="url(#ar)" stroke-opacity=".75"/>
    <path d="M 310 147 L 470 150" marker-end="url(#ar)" stroke-opacity=".75"/>
    <path d="M 310 221 C 380 221, 400 165, 470 155" marker-end="url(#ar)" stroke-opacity=".75"/>

    <rect x="474" y="86" width="406" height="128" rx="3" stroke-width="2"/>
    <text x="492" y="112" fill="#7a8590" stroke="none" font-size="13" font-weight="600">se-collate</text>
    <text x="492" y="136" fill="#7a8590" stroke="none" opacity=".85">one object · id  disk:wwn-0x5000c50…</text>
    <text x="492" y="156" fill="#7a8590" stroke="none" opacity=".85">names  scsi 2:0:5:0 · /dev/sdc · slot 3</text>
    <text x="492" y="180" fill="#7a8590" stroke="none" opacity=".62">joined on the stable name only —</text>
    <text x="492" y="198" fill="#7a8590" stroke="none" opacity=".62">/dev/sdc is carried, never joined on</text>

    <text x="474" y="250" fill="#7a8590" stroke="none" font-size="11" opacity=".7">No collector could have minted this. Each held two of the</text>
    <text x="474" y="266" fill="#7a8590" stroke="none" font-size="11" opacity=".7">names; none held all three.</text>
  </g>
</svg>
